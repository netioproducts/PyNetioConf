name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --locked --only-group dev ruff check --output-format=github .
      - run: uv run --locked --only-group dev ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    # Informational until the existing type errors are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pyright pyright src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - name: Import installed wheel
        run: >
          uv run --isolated --no-project --python ${{ matrix.python }}
          --with dist/*.whl
          python -c "import PyNetioConf, PyNetioConf.ESPCore, PyNetioConf.netio_device"

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
