name: Release

# Pushing a `v*` tag builds once, publishes to TestPyPI, then publishes the same files to PyPI
# (gated by the `pypi` environment's required reviewers).
# Running the workflow manually is a TestPyPI-only dry run and never reaches PyPI.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Check tag matches project version
        if: github.event_name == 'push'
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${version}"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Import every module from the built wheel
        env:
          PYTHON: ${{ matrix.python }}
        run: |
          uv run --isolated --no-project --python "${PYTHON}" --with dist/*.whl python -c '
          import importlib, pkgutil, PyNetioConf
          for module in pkgutil.walk_packages(PyNetioConf.__path__, "PyNetioConf."):
              importlib.import_module(module.name)
          '

  publish-testpypi:
    needs: smoke-test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/PyNetioConf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      # --check-url skips files that are already uploaded, so a re-run of a failed job doesn't fail.
      - run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/*

  publish-pypi:
    needs: publish-testpypi
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyNetioConf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/*
