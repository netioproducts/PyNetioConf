name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    # Trusted Publishing is configured for the upstream repository only.
    if: github.repository == 'netioproducts/PyNetioConf'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyNetioConf
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check tag matches project version
        run: |
          version=$(uv version --short)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
      - run: uv build
      - run: uv publish --trusted-publishing always
