[project]
name = "PyNetioConf"
version = "0.2.0a2"
requires-python = ">= 3.10"
authors = [
    { name = "NETIO products a.s.", email = "support@netio.eu" }
]
maintainers = [
    { name = "Jakub Šperl", email = "jsperl@netio.eu" }
]

description = "Universal module to control and configure all NETIO device"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["NETIO"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "websocket-client",
    "requests",
    "urllib3",
    "typing-extensions; python_version < '3.12'"
]

[project.urls]
Homepage = "https://netio-products.com/"
Repository = "https://github.com/netioproducts/PyNetioConf"
Issues = "https://github.com/netioproducts/PyNetioConf/issues"
Changelog = "https://github.com/netioproducts/PyNetioConf/blob/main/CHANGELOG.txt"

[build-system]
requires = ["uv_build >= 0.11, < 0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PyNetioConf"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",   # basic style
    "F",        # errors
    "I",        # imports
    "B",        # bugbear
    "S",        # security
    "UP",       # modern syntax
    "SIM",      # sim
    "RET",      # return
    "T20",      # no prints
    "T10",      # no forgotten breakpoints (replaces the debug-statements hook)
    "RUF",      # ruff
    "N",        # Naming
    "A",
    "DTZ",
    "RSE",
]
fixable = ["ALL"]
unfixable = []
ignore = ["S101", "T201", "N999", "N815", "N802", "S607", "S603", "N801", "S312", "A002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-line-length = "dynamic"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
